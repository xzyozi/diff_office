<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Word差分GUIとリンク整合性確認の構成イメージ</title>
  <desc id="description">Word文書比較画面。比較操作の下にリンク整合性の結果バーを表示する</desc>
  <style>
    .window { fill: #ffffff; stroke: #64748b; stroke-width: 2; } .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; } .input { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; } .button { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; } .text { font-family: "Segoe UI", "Yu Gothic", sans-serif; fill: #0f172a; } .label { font-size: 15px; font-weight: 600; } .body { font-size: 14px; } .muted { fill: #64748b; font-size: 13px; } .line { font-family: Consolas, monospace; font-size: 14px; }
  </style>
  <rect width="1200" height="800" fill="#e2e8f0"/>
  <rect class="window" x="30" y="25" width="1140" height="750" rx="8"/>
  <rect x="30" y="25" width="1140" height="48" rx="8" fill="#334155"/>
  <text class="text" x="54" y="56" fill="#ffffff" font-size="20">Word Document Diff (WinMerge Style)</text>
  <rect class="panel" x="50" y="92" width="1100" height="142" rx="6"/>
  <text class="text label" x="72" y="126">左 (Old):</text><rect class="input" x="160" y="105" width="530" height="31" rx="3"/><text class="text muted" x="174" y="126">比較元の .docx / .docm を選択</text><rect class="button" x="706" y="105" width="82" height="31" rx="3"/><text class="text body" x="722" y="126">参照...</text>
  <text class="text label" x="72" y="174">右 (New):</text><rect class="input" x="160" y="153" width="530" height="31" rx="3"/><text class="text muted" x="174" y="174">比較先の .docx / .docm を選択</text><rect class="button" x="706" y="153" width="82" height="31" rx="3"/><text class="text body" x="722" y="174">参照...</text>
  <rect x="820" y="105" width="130" height="79" rx="4" fill="#cbd5e1" stroke="#64748b"/><text class="text label" x="840" y="150">比較実行</text>
  <rect class="button" x="974" y="105" width="136" height="31" rx="3"/><text class="text body" x="989" y="126">☑ スクロール同期</text>
  <rect class="button" x="974" y="153" width="38" height="31" rx="3"/><text class="text body" x="985" y="174">▲</text><rect class="input" x="1019" y="153" width="34" height="31" rx="3"/><text class="text body" x="1031" y="174">2</text><text class="text body" x="1060" y="174">/ 4</text><rect class="button" x="1100" y="153" width="38" height="31" rx="3"/><text class="text body" x="1111" y="174">▼</text>
  <rect x="50" y="250" width="1100" height="54" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <circle cx="78" cy="277" r="10" fill="#f59e0b"/><text class="text label" x="100" y="282">リンク整合性</text><text class="text body" x="215" y="282">⚠ 3件の確認事項</text><rect x="385" y="263" width="108" height="27" rx="13" fill="#fef3c7"/><text class="text muted" x="398" y="282">構造確認のみ</text>
  <rect class="button" x="1010" y="262" width="118" height="30" rx="3"/><text class="text body" x="1028" y="282">詳細を表示</text>
  <rect class="panel" x="50" y="322" width="535" height="370" rx="4"/><rect class="panel" x="615" y="322" width="535" height="370" rx="4"/>
  <text class="text label" x="72" y="352">比較元 (Old)</text><text class="text label" x="637" y="352">比較先 (New)</text><line x1="70" y1="366" x2="565" y2="366" stroke="#cbd5e1"/><line x1="635" y1="366" x2="1130" y2="366" stroke="#cbd5e1"/>
  <rect x="68" y="387" width="499" height="25" fill="#ffffff"/><text class="text line" x="82" y="405">1 | 契約書の概要</text><rect x="633" y="387" width="499" height="25" fill="#ffffff"/><text class="text line" x="647" y="405">1 | 契約書の概要</text>
  <rect x="68" y="414" width="499" height="25" fill="#ffebcc"/><text class="text line" x="82" y="432">2 | 支払期限は月末とする</text><rect x="633" y="414" width="499" height="25" fill="#ffebcc"/><text class="text line" x="647" y="432">2 | 支払期限は翌月末とする</text>
  <rect x="68" y="441" width="499" height="25" fill="#ffdddd"/><text class="text line" x="82" y="459">3 | 旧条項のリンク</text><rect x="633" y="441" width="499" height="25" fill="#f0f0f0"/>
  <rect x="68" y="468" width="499" height="25" fill="#f0f0f0"/><rect x="633" y="468" width="499" height="25" fill="#ddffdd"/><text class="text line" x="647" y="486">3 | 新条項のリンク</text>
  <rect x="68" y="495" width="499" height="25" fill="#ffffff"/><text class="text line" x="82" y="513">4 | 適用開始日</text><rect x="633" y="495" width="499" height="25" fill="#ffffff"/><text class="text line" x="647" y="513">4 | 適用開始日</text>
  <rect x="50" y="722" width="18" height="18" fill="#ffdddd"/><text class="text muted" x="76" y="737">削除</text><rect x="150" y="722" width="18" height="18" fill="#ddffdd"/><text class="text muted" x="176" y="737">追加</text><rect x="250" y="722" width="18" height="18" fill="#ffebcc"/><text class="text muted" x="276" y="737">置換</text><rect x="350" y="722" width="18" height="18" fill="#f0f0f0"/><text class="text muted" x="376" y="737">対応する空行</text>
</svg>