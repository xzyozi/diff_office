name: CI

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run Ruff (Linter)
        run: |
          uv run ruff check .

      - name: Run Ruff (Formatter Check)
        run: |
          uv run ruff format --check .

      - name: Run Mypy (Type Check)
        run: |
          if [ -z "$(git ls-files -- '*.py' '*.pyi')" ]; then
            echo "No Python files found; skipping Mypy."
            exit 0
          fi
          git ls-files -z -- '*.py' '*.pyi' | xargs -0 uv run mypy

      - name: Run Pytest
        run: |
          if [ -z "$(git ls-files -- 'test_*.py')" ]; then
            echo "No test files found; skipping Pytest."
            exit 0
          fi
          git ls-files -z -- 'test_*.py' | xargs -0 uv run pytest
